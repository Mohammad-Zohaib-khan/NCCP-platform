# Local development stack: Postgres + Redis (optional) + API.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nccp
      POSTGRES_PASSWORD: nccp
      POSTGRES_DB: nccp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nccp -d nccp"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  migrate:
    build: .
    command: ["node", "dist/db/migrate.js", "up"]
    environment:
      DATABASE_URL: postgres://nccp:nccp@db:5432/nccp
    depends_on:
      db: { condition: service_healthy }
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://nccp:nccp@db:5432/nccp
      FRONTEND_ORIGINS: http://localhost:3000
      AUTH_JWT_SECRET: change-me-jwt-secret-at-least-32-characters-long
      AUTH_COOKIE_SECRET: change-me-cookie-secret-different-from-jwt-key
      APP_BASE_URL: http://localhost:3000
      FEATURE_QR_ATTENDANCE: 'true'
      FEATURE_FACE_ATTENDANCE: 'false'
      FEATURE_FINGERPRINT_DEMO: 'true'
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
