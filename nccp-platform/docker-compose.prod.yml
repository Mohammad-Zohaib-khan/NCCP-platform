version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nccp-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nccp}
      POSTGRES_USER: ${POSTGRES_USER:-nccp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - nccp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nccp} -d ${POSTGRES_DB:-nccp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nccp-internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nccp-api-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-nccp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nccp}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Frontend origin required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?JWT secret required}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:?Cookie secret required}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      APP_BASE_URL: ${APP_BASE_URL:?Base URL required}
      FEATURE_QR_ATTENDANCE: "true"
      FEATURE_FACE_ATTENDANCE: "false"
      FEATURE_FINGERPRINT_DEMO: "false"
      I18N_DEFAULT_LANGUAGE: "en"
      I18N_ENABLED_LANGUAGES: "en,hi"
      TRUST_PROXY: "true"
    command: >
      sh -c "node dist/db/migrate.js up && node scripts/seed-admin.mjs && node dist/server.js"
    networks:
      - nccp-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nccp-frontend-prod
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_BASE_URL: /api/v1
    networks:
      - nccp-internal

  proxy:
    image: nginx:alpine
    container_name: nccp-proxy-prod
    restart: always
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nccp-internal

networks:
  nccp-internal:
    driver: bridge

volumes:
  nccp_db_data:
