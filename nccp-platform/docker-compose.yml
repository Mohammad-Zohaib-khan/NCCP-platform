version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nccp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nccp}
      POSTGRES_USER: ${POSTGRES_USER:-nccp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nccp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nccp} -d ${POSTGRES_DB:-nccp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nccp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://nccp:nccp@db:5432/nccp}
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-jwt-secret-for-local-dev-must-be-min-32-chars-long}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-cookie-secret-for-local-dev-must-be-min-32-chars-long}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      FEATURE_QR_ATTENDANCE: "true"
      FEATURE_FACE_ATTENDANCE: "false"
      FEATURE_FINGERPRINT_DEMO: "false"
      I18N_DEFAULT_LANGUAGE: "en"
      I18N_ENABLED_LANGUAGES: "en,hi"
      TRUST_PROXY: "true"
    ports:
      - "8080:8080"
    command: >
      sh -c "node dist/db/migrate.js up && node scripts/seed-demo-users.mjs && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nccp-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "3000:3000"

  proxy:
    image: nginx:alpine
    container_name: nccp-proxy
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
