  <path d="M32 24 L32 40 M24 32 L40 32 M26.3 26.3 L37.7 37.7 M26.3 37.7 L37.7 26.3" stroke="url(#saffronGrad)" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Bottom Saffron / Green Accents -->
